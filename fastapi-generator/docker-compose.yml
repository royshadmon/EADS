version: "3.9"

# ---------------------------------------------------------------
# EADS FastAPI Data Generators (Sprint 2)
#
# Each service streams the PowerGridSense CSV dataset to an
# outage proxy, which then forwards to the AnyLog operator.
#
# Data flow:
#   Generator ──PUT──> Outage Proxy ──PUT──> AnyLog operator
#
# Generator ports : 8001 / 8002 / 8003
# Proxy ports     : 9001 / 9002 / 9003  (see outage-simulator/)
# AnyLog ports    : 32149 / 32249 / 32349
#
# NOTE: Start the outage proxies first (../outage-simulator/)
# ---------------------------------------------------------------

services:
  # ---------- Generator for Operator 1 (via Proxy 1) ----------
  generator-1:
    build:
      context: ..
      dockerfile: fastapi-generator/Dockerfile
    container_name: eads-generator-1
    network_mode: host
    environment:
      ANYLOG_CONN: 127.0.0.1:9001  # -> proxy-1 -> operator-1
      ANYLOG_MODE: file
      CSV_PATH: /data/power_system_multiclass_anomaly_data.csv
      BATCH_SIZE: 100
      RATE_HZ: 10
      UVICORN_PORT: 8001
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  # ---------- Generator for Operator 2 (via Proxy 2) ----------
  generator-2:
    build:
      context: ..
      dockerfile: fastapi-generator/Dockerfile
    container_name: eads-generator-2
    network_mode: host
    environment:
      ANYLOG_CONN: 127.0.0.1:9002  # -> proxy-2 -> operator-2
      ANYLOG_MODE: file
      CSV_PATH: /data/power_system_multiclass_anomaly_data.csv
      BATCH_SIZE: 100
      RATE_HZ: 10
      UVICORN_PORT: 8002
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002

  # ---------- Generator for Operator 3 (via Proxy 3) ----------
  generator-3:
    build:
      context: ..
      dockerfile: fastapi-generator/Dockerfile
    container_name: eads-generator-3
    network_mode: host
    environment:
      ANYLOG_CONN: 127.0.0.1:9003  # -> proxy-3 -> operator-3
      ANYLOG_MODE: file
      CSV_PATH: /data/power_system_multiclass_anomaly_data.csv
      BATCH_SIZE: 100
      RATE_HZ: 10
      UVICORN_PORT: 8003
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003
