syntax = "proto3";

package eads;

service SensorService {
  rpc GetSensorData (SensorRequest) returns (SensorDataResponse);
  rpc StreamSensorData (SensorRequest) returns (stream SensorReading);
}

message SensorRequest {
  int32 count = 1;
}

message SensorReading {
  string timestamp = 1;
  double voltage = 2;
  string sensor_id = 3;
  double latitude = 4;
  double longitude = 5;
}

message SensorDataResponse {
  repeated string serialized_data = 1;
}
