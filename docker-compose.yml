version: "3.9"

# ---------------------------------------------------------------
# EADS Data Generators
#
# Each service streams the PowerGridSense CSV dataset to a
# different AnyLog operator via REST PUT.
#
# To add a new generator: copy a service block and change
# ANYLOG_CONN and the ports mapping.
# ---------------------------------------------------------------

services:
  # ---------- Generator for Operator 1 ----------
  generator-1:
    build: .
    container_name: eads-generator-1
    environment:
      ANYLOG_CONN: anylog-operator1:32149
      ANYLOG_MODE: file             # "file" (immediate) or "streaming" (buffered)
      CSV_PATH: /data/power_system_multiclass_anomaly_data.csv
      BATCH_SIZE: 400
      RATE_HZ: 20                   # 400 * 20 = 8000 rows/sec (8 kHz)
    ports:
      - "8001:8000"
    restart: unless-stopped
    # Uncomment to join an existing AnyLog docker network:
    # networks:
    #   - anylog_default

  # ---------- Generator for Operator 2 ----------
  generator-2:
    build: .
    container_name: eads-generator-2
    environment:
      ANYLOG_CONN: anylog-operator2:32249
      ANYLOG_MODE: file
      CSV_PATH: /data/power_system_multiclass_anomaly_data.csv
      BATCH_SIZE: 400
      RATE_HZ: 20
    ports:
      - "8002:8000"
    restart: unless-stopped

  # ---------- Generator for Operator 3 ----------
  generator-3:
    build: .
    container_name: eads-generator-3
    environment:
      ANYLOG_CONN: anylog-operator3:32349
      ANYLOG_MODE: file
      CSV_PATH: /data/power_system_multiclass_anomaly_data.csv
      BATCH_SIZE: 400
      RATE_HZ: 20
    ports:
      - "8003:8000"
    restart: unless-stopped

# Uncomment to join an existing AnyLog docker network:
# networks:
#   anylog_default:
#     external: true
#     name: docker-compose-files_default
