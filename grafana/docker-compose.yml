services:
  grafana:
    image: grafana/grafana:11.4.0
    container_name: eads-grafana-anylog
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: simpod-json-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/eads-anylog.json
      ANYLOG_HOST: ${ANYLOG_HOST:-host.docker.internal}
      ANYLOG_REST_PORT: ${ANYLOG_REST_PORT:-32149}
    volumes:
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage:
