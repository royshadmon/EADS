<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EADS Voltage Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }

    header { margin-bottom: 24px; }
    header h1 { font-size: 1.3rem; font-weight: 600; color: #fff; }
    header p { font-size: 0.78rem; color: #555; margin-top: 2px; }

    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: #1a1d27;
      border: 1px solid #252836;
      border-radius: 8px;
      padding: 14px 18px;
      flex: 1;
      min-width: 110px;
    }

    .stat-card .label {
      font-size: 0.68rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 1.55rem;
      font-weight: 600;
      color: #00c896;
      line-height: 1;
    }

    .stat-card .unit {
      font-size: 0.78rem;
      color: #666;
      font-weight: 400;
      margin-left: 3px;
    }

    .footer {
      margin-top: 12px;
      font-size: 0.7rem;
      color: #333;
      text-align: right;
    }

    .footer.ok { color: #00c896; }
    .footer.error { color: #e05c5c; }
  </style>
</head>
<body>

  <header>
    <h1>EADS Voltage Monitor</h1>
    <p>Channel 1 &mdash; 7680 Hz</p>
  </header>

  <div class="stats">
    <div class="stat-card">
      <div class="label">Min</div>
      <div class="value" id="stat-min">—<span class="unit">V</span></div>
    </div>
    <div class="stat-card">
      <div class="label">Max</div>
      <div class="value" id="stat-max">—<span class="unit">V</span></div>
    </div>
    <div class="stat-card">
      <div class="label">Avg</div>
      <div class="value" id="stat-avg">—<span class="unit">V</span></div>
    </div>
    <div class="stat-card">
      <div class="label">Frequency</div>
      <div class="value" id="stat-freq">—<span class="unit">Hz</span></div>
    </div>
  </div>

  <div class="footer" id="status">Connecting...</div>

  <script>
    function setVal(id, value, unit) {
      document.getElementById(id).innerHTML = value + `<span class="unit">${unit}</span>`;
    }

    function setStatus(msg, ok = true) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'footer ' + (ok ? 'ok' : 'error');
    }

    async function refresh() {
      try {
        const statsRes = await fetch('/api/stats');
        const stats = await statsRes.json();

        setVal('stat-min', stats.min, 'V');
        setVal('stat-max', stats.max, 'V');
        setVal('stat-avg', stats.avg, 'V');
        setVal('stat-freq', stats.frequency_hz, 'Hz');

        setStatus('Updated ' + new Date().toLocaleTimeString());
      } catch (e) {
        setStatus('Error: ' + e.message, false);
      }
    }

    refresh();
    setInterval(refresh, 60000);
  </script>

</body>
</html>
