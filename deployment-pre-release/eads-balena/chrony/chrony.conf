# EADS chrony configuration
# Primary source: gpsd via SHM segment 0. Fallback: internet NTP pool.

refclock SHM 0 offset 0.0 delay 0.2 refid GPS precision 1e-1
pool pool.ntp.org iburst

allow 127.0.0.1

driftfile /var/lib/chrony/drift

# Step the clock for ANY offset >1s, at any time — not just the first few
# updates. A Pi with no RTC boots with a wildly wrong clock; slewing a
# multi-minute (or multi-year) offset would take days. Stepping is exactly
# what we want on an unattended sensor node.
makestep 1.0 -1

rtcsync

# No measurement/statistics logging: those files grow continuously and the
# only writable medium is the SD card. chronyc tracking gives live status
# when needed.
