server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to AnyLog query node — avoids CORS issues
    location /anylog {
        # Strip the /anylog prefix before forwarding
        rewrite ^/anylog(.*) /$1 break;

        # Handle CORS preflight — AnyLog doesn't support OPTIONS,
        # so nginx answers it directly
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'User-Agent, command, destination, Content-Type';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:32149;
        proxy_set_header Host $host;
        proxy_set_header User-Agent "AnyLog/1.23";
        proxy_set_header X-Real-IP $remote_addr;

        # Pass custom headers through to AnyLog
        proxy_pass_request_headers on;

        # Add CORS headers to the actual response
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'User-Agent, command, destination, Content-Type' always;
    }
}
