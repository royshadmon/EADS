version: "3.9"

# ---------------------------------------------------------------
# EADS Data Generators
#
# Each service wraps eads_data_generator.py in a FastAPI container
# targeting a different AnyLog operator.
#
# To add a new generator: copy a service block and change env vars.
# ---------------------------------------------------------------

services:
  # ---------- Generator for Operator 1 ----------
  generator-1:
    build: .
    container_name: eads-generator-1
    environment:
      SENSOR_ID: EADS-V-001
      SENSOR_LAT: 32.7157
      SENSOR_LON: -117.1611
      SENSOR_RMS_VOLTAGE: 120.0
      ANYLOG_CONN: anylog-operator-1:32149
      ANYLOG_DBMS: eads
      ANYLOG_TABLE: voltage_readings
      METHOD: rest-put            # rest-put | rest-post | grpc-serve
      ANYLOG_MODE: streaming      # streaming | file
      SAMPLE_RATE_HZ: 1000
      BATCH_SIZE: 1000
    ports:
      - "8001:8000"
    restart: unless-stopped
    # Uncomment to join an existing AnyLog docker network:
    # networks:
    #   - anylog_default

  # ---------- Generator for Operator 2 ----------
  generator-2:
    build: .
    container_name: eads-generator-2
    environment:
      SENSOR_ID: EADS-V-002
      SENSOR_LAT: 32.7300
      SENSOR_LON: -117.1500
      SENSOR_RMS_VOLTAGE: 240.0
      ANYLOG_CONN: anylog-operator-2:32149
      ANYLOG_DBMS: eads
      ANYLOG_TABLE: voltage_readings
      METHOD: rest-put
      ANYLOG_MODE: streaming
      SAMPLE_RATE_HZ: 1000
      BATCH_SIZE: 1000
    ports:
      - "8002:8000"
    restart: unless-stopped

  # ---------- Generator for Operator 3 ----------
  generator-3:
    build: .
    container_name: eads-generator-3
    environment:
      SENSOR_ID: EADS-V-003
      SENSOR_LAT: 32.7050
      SENSOR_LON: -117.1700
      SENSOR_RMS_VOLTAGE: 480.0
      ANYLOG_CONN: anylog-operator-3:32149
      ANYLOG_DBMS: eads
      ANYLOG_TABLE: voltage_readings
      METHOD: rest-put
      ANYLOG_MODE: streaming
      SAMPLE_RATE_HZ: 1000
      BATCH_SIZE: 1000
    ports:
      - "8003:8000"
    restart: unless-stopped

# Uncomment to join an existing AnyLog docker network:
# networks:
#   anylog_default:
#     external: true
