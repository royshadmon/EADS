# ---------------------------------------------------------------
# EADS — Data Generators + Outage Proxies  (Sprint 2 + Proxy)
#
# Data flow per operator:
#   Generator  ──PUT──>  Outage Proxy  ──PUT──>  AnyLog operator
#
# Generator ports  : 8001 / 8002 / 8003
# Proxy ports      : 9001 / 9002 / 9003
# AnyLog ports     : 32149 / 32249 / 32349  (host networking)
#
# Control outages from the terminal:
#   ./outage_cli.sh 1 start    # spike → outage on operator 1
#   ./outage_cli.sh 1 stop     # return to normal on operator 1
#   ./outage_cli.sh all status # check all three proxies
# ---------------------------------------------------------------

services:

  # ════════════════════════════════════════════════════════════
  # Outage Proxies  (one per operator)
  # ════════════════════════════════════════════════════════════

  proxy-1:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: eads-proxy-1
    network_mode: host
    environment:
      ANYLOG_URL:         "http://127.0.0.1:32149"
      OPERATOR_LABEL:     "operator-1"
      SPIKE_DURATION_SEC: 3
    restart: unless-stopped
    command: uvicorn outage_proxy:app --host 0.0.0.0 --port 9001

  proxy-2:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: eads-proxy-2
    network_mode: host
    environment:
      ANYLOG_URL:         "http://127.0.0.1:32249"
      OPERATOR_LABEL:     "operator-2"
      SPIKE_DURATION_SEC: 3
    restart: unless-stopped
    command: uvicorn outage_proxy:app --host 0.0.0.0 --port 9002

  proxy-3:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: eads-proxy-3
    network_mode: host
    environment:
      ANYLOG_URL:         "http://127.0.0.1:32349"
      OPERATOR_LABEL:     "operator-3"
      SPIKE_DURATION_SEC: 3
    restart: unless-stopped
    command: uvicorn outage_proxy:app --host 0.0.0.0 --port 9003

  # ════════════════════════════════════════════════════════════
  # Data Generators  (one per operator)
  # ANYLOG_CONN now points at the proxy, NOT AnyLog directly.
  # This is the only change from the original generator config.
  # ════════════════════════════════════════════════════════════

  generator-1:
    build: .
    container_name: eads-generator-1
    network_mode: host
    depends_on: [proxy-1]
    environment:
      ANYLOG_CONN: "127.0.0.1:9001"   # ← was 127.0.0.1:32149
      ANYLOG_MODE: file
      CSV_PATH:    /data/power_system_multiclass_anomaly_data.csv
      BATCH_SIZE:  100
      RATE_HZ:     10
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  generator-2:
    build: .
    container_name: eads-generator-2
    network_mode: host
    depends_on: [proxy-2]
    environment:
      ANYLOG_CONN: "127.0.0.1:9002"   # ← was 127.0.0.1:32249
      ANYLOG_MODE: file
      CSV_PATH:    /data/power_system_multiclass_anomaly_data.csv
      BATCH_SIZE:  100
      RATE_HZ:     10
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002

  generator-3:
    build: .
    container_name: eads-generator-3
    network_mode: host
    depends_on: [proxy-3]
    environment:
      ANYLOG_CONN: "127.0.0.1:9003"   # ← was 127.0.0.1:32349
      ANYLOG_MODE: file
      CSV_PATH:    /data/power_system_multiclass_anomaly_data.csv
      BATCH_SIZE:  100
      RATE_HZ:     10
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003
